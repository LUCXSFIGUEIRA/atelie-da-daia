<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <title>Ateliê da Daia | Vestidos e consertos de roupa em Guareí-SP</title>
    <meta
      name="description"
      content="Vestidos de festa, noiva, daminha, formatura e festa junina, além de consertos e ajustes de qualquer roupa, em Guareí-SP. Chame a Daia no WhatsApp e peça seu orçamento."
    />
    <meta name="theme-color" content="#FFF4F8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph: se usar domínio próprio, troque lucxsfigueira.github.io/atelie-da-daia -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Ateliê da Daia" />
    <meta property="og:title" content="Ateliê da Daia" />
    <meta
      property="og:description"
      content="Vestidos para toda ocasião e consertos com capricho em Guareí-SP. Orçamento pelo WhatsApp."
    />
    <!-- ?v=2 força o WhatsApp/Facebook a buscar a imagem nova; troque o número sempre que mudar o og.jpg -->
    <meta property="og:image" content="https://lucxsfigueira.github.io/atelie-da-daia/og.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do Ateliê da Daia: tesoura e o nome do ateliê" />
    <meta property="og:url" content="https://lucxsfigueira.github.io/atelie-da-daia/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Foto principal do hero carregada com prioridade (LCP) -->
    <link rel="preload" as="image" href="/img/vestido_3.webp" type="image/webp" />

    <!-- Dados estruturados para o Google (negócio local) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Ateliê da Daia",
        "description": "Vestidos para toda ocasião e consertos de roupa.",
        "telephone": "+55 15 99803-5996",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Adalberto Rocha, 688, Centro",
          "addressLocality": "Guareí",
          "addressRegion": "SP",
          "postalCode": "18250-029",
          "addressCountry": "BR"
        },
        "image": "https://lucxsfigueira.github.io/atelie-da-daia/og.jpg",
        "sameAs": ["https://www.instagram.com/ateliedadaia/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
