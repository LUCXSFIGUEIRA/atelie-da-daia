<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <title>Ateliê da Daia | Vestidos para toda ocasião e consertos de roupa</title>
    <meta
      name="description"
      content="Vestidos de festa, noiva, daminha, formatura e festa junina, além de consertos e ajustes de qualquer roupa. Chame a Daia no WhatsApp e peça seu orçamento."
    />
    <meta name="theme-color" content="#FFF4F8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph: troque SEU-DOMINIO pelo endereço real do site depois de publicar -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Ateliê da Daia" />
    <meta property="og:title" content="Ateliê da Daia | Vestidos e consertos com capricho" />
    <meta
      property="og:description"
      content="Vestidos para toda ocasião e consertos de qualquer roupa. Orçamento pelo WhatsApp."
    />
    <meta property="og:image" content="https://SEU-DOMINIO.com.br/og.jpg" />
    <meta property="og:url" content="https://SEU-DOMINIO.com.br/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Foto principal do hero carregada com prioridade (LCP) -->
    <link rel="preload" as="image" href="/img/vestido_3.webp" type="image/webp" />

    <!-- Dados estruturados para o Google (negócio local) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Ateliê da Daia",
        "description": "Vestidos para toda ocasião e consertos de roupa.",
        "telephone": "+55 15 99803-5996",
        "image": "https://SEU-DOMINIO.com.br/og.jpg",
        "sameAs": ["https://www.instagram.com/ateliedadaia/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
